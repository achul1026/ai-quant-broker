[project]
name = "aiqb"
version = "0.1.0"
description = "AI hybrid quant trading system — TimescaleDB time-series + LangGraph multi-agent + Backtrader"
readme = "README.md"
authors = [
    { name = "aiden", email = "aiden.kim@bluedus.co.kr" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "finance-datareader>=0.9.202",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "pykrx>=1.2.8",
]

[project.scripts]
aiqb = "aiqb:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
